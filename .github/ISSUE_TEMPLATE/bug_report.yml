name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include passwords, session cookies, master keys, SSH private keys, console tokens, database dumps, or VM disk images.
        Report security vulnerabilities privately as described in SECURITY.md.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Deploy with ...
        2. Open ...
        3. Run ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: WebVirtCloud Go version
      description: Output of `wvc version`
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, PostgreSQL, libvirt/QEMU versions, deployment method, and browser if relevant.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove credentials, hostnames, IP addresses, and tokens before posting.
      render: shell

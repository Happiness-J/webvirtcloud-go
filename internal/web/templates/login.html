{{define "content"}}
<section class="login-card">
  <div class="login-mark">WVC</div>
  <p class="page-kicker">控制台登录</p>
  <h1>进入虚拟化控制面</h1>
  <p class="muted">管理 QEMU/KVM 主机、虚拟机、存储和网络。</p>
  <form method="post" action="/login" class="stack">
    <input type="hidden" name="_csrf" value="{{.CSRF}}">
    <input type="hidden" name="next" value="{{.Data.Next}}">
    <label>用户名<input name="username" autocomplete="username" required autofocus></label>
    <label>密码<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn primary wide">登录</button>
  </form>
  <p class="hint">首次启动的管理员密码只保存在主密钥目录的一次性文件中。登录后请立即修改密码并删除该文件。</p>
</section>
{{end}}

{{define "content"}}
<div class="page-head"><div><h1>修改密码</h1><p class="muted">修改后当前账号的所有会话都会失效，需要用新密码重新登录。</p></div></div>
<section class="panel narrow"><form method="post" action="/account/password" class="stack">
  <input type="hidden" name="_csrf" value="{{.CSRF}}">
  <label>当前密码<input name="current_password" type="password" required autocomplete="current-password"></label>
  <label>新密码<input name="new_password" type="password" required minlength="10" maxlength="4096" autocomplete="new-password"></label>
  <label>确认新密码<input name="confirm_password" type="password" required minlength="10" maxlength="4096" autocomplete="new-password"></label>
  <div class="form-actions"><button class="btn primary">修改密码</button><a class="btn" href="/">取消</a></div>
</form></section>
{{end}}
